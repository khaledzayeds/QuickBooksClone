name: CI

on:
  push:
    branches:
      - Zayed
      - release/**
  pull_request:
    branches:
      - Zayed
      - release/**

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore backend
        run: dotnet restore Zayed.slnx

      - name: Build backend
        run: dotnet build Zayed.slnx --no-restore --disable-build-servers /m:1 /p:UseSharedCompilation=false /p:RunAnalyzers=false -v:minimal

      - name: Flutter pub get
        working-directory: QuickBooksFlutter/zayed
        run: flutter pub get

      - name: Flutter analyze
        working-directory: QuickBooksFlutter/zayed
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter Windows build
        working-directory: QuickBooksFlutter/zayed
        run: flutter build windows --release
